# 主力集團偵測 v3（《主力集團偵測 v3 修正規格》2026-11-04）：事先固定參數
# 修改規則：寫入 broker_flow_v3/CHANGELOG.md 並註明規格條目，理由不得來自驗證結果。未列出者同 v2。
version: 3

governance:                   # §2
  t_cut: "2026-11-04"         # §2.1 寫死、不滾動
  holdout_seed: 20261104
  holdout_group_frac: 0.5
  holdout_stock_frac: 0.2
  max_diagnostic_rounds: 3
  dev_stocks: ["2601", "5907"]
  dev_groups: ["2601G"]

universe:                     # §2.3
  top_n: 800
  lookback: 60

data:                         # §3.1
  finmind_start: "2021-06-30"
  imbalance_max: 0.02
  avg_price_tol: 0.01

exclude_foreign: false

revision:
  b2_sell_mult: 2.0
  b2_sell_min_lots: 10
  b2_absorb_ratio: 0.1
  b2_vwap_tol: 0.005
  b2_seller_below_vwap: true  # §6.2
  loss_leg_vwap_tol: 0.01

dim_b:
  cold_quantile: 0.2
  cold_min_lots: 5
  participate: 0.1
  frechet_min_lots: 1
  n_null: 50
  cond_p_min_nonzero_null: 20 # §6.1 M

groups:
  - id: "2601G"
    name: "益航集團"
    members:
      - {sid: "2601", from: "2000-01-01", to: "2099-12-31"}
      - {sid: "5907", from: "2000-01-01", to: "2025-11-30"}
    known_branches: []
    fake_groups: 50
    exclude_from_fake: ["2601", "5907"]

accounting:
  warmup_days: 180
  fee_rate: 0.001425
  fee_discount: 1.0                 # §3.4
  fee_discount_sensitivity: 0.3
  tax_sell: 0.003
  tax_daytrade: 0.0015
  short_lot_enabled: true           # §3.3
  margin_unit_shares: 1000          # §3.3 需確認：融券賣出（張）→ 股；借券賣出本來就是股（執行時兩者交叉核對寫進 log）

behavior:
  rolling_days: 120
  activity_basis: net               # §4.1
  exclude_daytrade_type: false      # §4.1
  daytrade_ratio: 0.6
  overnight_event_mult: 2.0
  overnight_ratio: 0.7
  overnight_min_events: 5
  min_active_days: 10
  sc_min_shares: 10000              # §4.2
  sc_min_vol_frac: 0.01
  sc_z: 3
  sc_mad_floor: 0.01                # SPEC-GAP-v3：MAD = 0 時的下限
  sc_min_events: 3
  gov_bank_names: ["臺銀", "台銀", "土銀", "合庫", "第一金", "華南", "彰銀", "兆豐", "台企銀"]   # SPEC-GAP-v3：名稱比對

detection:
  window_days: 120
  window_step: 20
  min_candidate_active: 5
  active_min_shares: 1000
  active_scale_mult: 0.5
  lambda_gamma: 1.0                 # §5.1
  lambda_delta: 1.0
  alpha_bound: 12.0                 # SPEC-GAP-v3：分點固定效果不懲罰，數值上限 |α| ≤ 12（全活躍／全不活躍的分點）
  mag_min_common: 20
  mag_null_perms: 200               # §5.3
  mag_shift_min: 10
  znet_extreme: 2

dim_c:
  enabled: false                    # 今晚上線版：維度 C 在背景以新架構計算，完成後打開
  background_offset: true
  null_same_procedure: true
  scp_require_extreme_days: 1
  # v3.1 極端日（取代 |z| ≥ 2）：n ≥ max(Q0.9, 0.005·V, 10,000 股)；Q0.9＝前 120 日（不含當日）非零 |n| 的第 90 百分位數，非零日 < 20 不算
  ext_quantile: 0.9
  ext_lookback: 120
  ext_min_nonzero: 20
  ext_vol_frac: 0.005
  ext_min_shares: 10000
  max_tensor_nnz: 5000000          # v3.1：擬合前先數非零格數，超過就停止並回報，不自行調整門檻
  chunk_rows: 500000               # v3.1：乘法更新分塊列數
  null_pairs: 5000                 # SPEC-GAP-v3（記憶體）：每檔股票每次虛無抽樣的配對數
  max_missing_week_frac: 0.5
  fit_weeks: 104
  refit_weeks: 13
  rank_candidates: [10, 20, 40, 60, 80, 100]
  inits: 5                        # §7.3：計算時間不夠 → 觀測與虛無「同時」降低（10 → 5 組初始值、穩定門檻 8 → 4）
  fms_min: 0.8
  stable_min: 4
  appear_stock: 0.02
  appear_weeks: 0.05
  fraudar_edge: 3
  fraudar_blocks: 20
  null_cp: 20
  null_fr: 50
  refit_change: 0.05

nulls:
  gpd_max_null: 1000000
  gpd_quantile: 0.99
  gpd_min_exceed: 30                # §7.6

fusion:
  fdr_q: 0.05
  fdr_family: window                # §8.2
  opp_require_corroboration: true   # §8.1
  opp_corroboration_alpha: 0.05
  group_inventory_share: 0.005
  min_core_size: 3                  # §8.3
  p_clip: 1.0e-15

group_mode:
  branch_combine: simes             # §9.1
  detail_windows: 6
  fake_windows: 6                   # SPEC-GAP-v3（今晚上線版）：假集團對照只算最近 6 個窗口

validation:
  naive_last_days: 20
  naive_top: 10

# ─────────────────────────────────────────────────────────────────────────────
# 單一分點擇時偵測 v1.1.2（凍結版，docs/timing_spec_v1.1.2.md §10）。不影響上方 v3 參數。
# 修改規則：寫入 broker_timing/CHANGELOG.md 並註明規格條目，理由不得來自驗證結果。
timing:
  timing_version: "1.1.2+r2"         # 診斷第 2 輪：§3.4 單日超額對數報酬、§4.4 反向迴歸 + Hunter–Worsley，見 broker_timing/CHANGELOG.md
  price_load_start: "2020-11-01"     # §3.1
  min_history_days: 120              # §3.1
  horizons: [5, 10, 20, 40]          # §4.3
  sample_end_buffer: 40              # §4.1
  beta_lookback: 120                 # §3.4
  beta_min_obs: 60                   # SPEC-GAP-timing：滾動窗口內有效日報酬不足 60 筆 → β 為 NaN（該日不進樣本）
  industry_min_peers: 5              # §3.4
  ridge_lambda: 0.01                 # §4.2：目標函數除以 N_act；sklearn alpha = λ · N_act
  reaction_features: ["min(r_t,0)", "r_{t-1}", "sum_r_5", "sum_r_20", "pos20_{t-1}", "log((V_{t-1}+1)/(Vmed+1))", "min(r_mkt_t,0)"]
  reaction_feature_eplus: "max(r_t,0)"   # §4.5 E+
  pos20_basis: adj_close             # §4.2
  pos20_window: 20
  volume_median_window: [61, 2]      # §4.2：Ṽ_{t−1} = [t−61, t−2] 的成交量中位數
  hac_lag: 40                        # §4.4 堆疊式 Newey–West
  hac_inference: reverse_hw          # 第 2 輪：反向迴歸分數 + Bartlett score_hac_lag + 標準常態 + Hunter–Worsley；第 1 輪 fixed_b、原文 t_geff 可重現
  score_hac_lag: 5                   # 第 2 輪：反向迴歸分數的 Bartlett 延遲（事先定的單一值，不調整）
  fixedb_table: "fixedb-exactqf-v1"  # 有限 T 高斯二次型的精確反轉（鞍點垂直線積分）+ PCHIP 網格；見 broker_timing/fixedb.py
  fixedb_max_grid: 2000              # SPEC-GAP-timing：T > 2000 時以 2000 格點、b 不變近似
  block_len_geff: 20                 # §4.4
  multi_horizon_combine: hunter_worsley    # 第 2 輪：Hunter–Worsley 上界（原文 cheverud_nyholt：M_eff × 單變量尾機率；M_eff 仍輸出供參考）
  ei_max_discard_frac: 0.10          # §4.5
  p_floor: 1.0e-15                   # §4.4
  ei_bootstrap_block: 40             # §4.5
  ei_bootstrap_reps: 999
  ei_ci_level: 0.90
  rho_threshold: 0.5                 # §4.5、§5：Δ = θ^EI − 0.5 θ^E
  rho_display_max_drop: 0.10
  min_active_days: 40                # §6.1
  min_geff: 8
  min_cycles: 3                      # §6.1、§6.2
  few_cycles_flag: 5                 # 完整循環 < 5 標「樣本偏少」
  zigzag_amount_ntd: 5000000         # §6.2
  zigzag_median_mult: 5
  min_volume_share: 0.005            # §6.1
  fdr_q: 0.05                        # §7
  chase_flag_p: 0.05                 # §5 當日追價旗標：p^{E+} > 0.05
  rolling_window: 240                # §7（只描述）
  rolling_step: 20
  position_k: 10                     # §8（只描述）
  pending_days: 40                   # §8
  placebo_match: ["log_market_cap", "log_avg_trading_value", "beta_m"]   # §9.1；不同產業
  injection_phi: [0.02, 0.05]        # §9.2
  injection_pi: [0.1, 0.3]
  injection_psi: [0.55, 0.6, 0.7]
  impact_coef: 1.0
  impact_permanent_frac: 0.5
  injection_min_detected: 20
  max_confusion_rate: 0.10
  max_diagnostic_rounds: 3           # §9
